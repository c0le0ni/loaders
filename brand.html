<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Loaders brand lab</title>
    <style>
      html, body { margin: 0; background: #0a0a0a; color: #f5f5f5; font: 13px/1.5 system-ui, sans-serif; }
      main { display: grid; gap: 28px; padding: 28px; }
      .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
      .panel { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 24px 28px; }
      .light { background: #f3f4f5; color: #1b1c1e; }
      .bar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: #1b1c1e; border-radius: 12px; }
      .slash { width: 1px; height: 18px; background: rgba(255,255,255,.14); transform: skewX(-18deg); }
      h2 { margin: 0 0 14px; font-size: 12px; font-weight: 500; color: #858585; letter-spacing: 0; }
      .cap { font-size: 11px; color: #858585; margin-top: 6px; text-align: center; }
      .opt { display: grid; gap: 18px; }
      .lime { color: #aefa0e; }
    </style>
    <script type="module" src="/src/brand-lab.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
