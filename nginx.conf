server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;
  # behind the proxy nginx only sees http: redirects keep the path alone (/pt -> /pt/), so the browser stays on https
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain application/manifest+json;
  gzip_min_length 1024;

  # Locations below only use `expires`, so they inherit these headers.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # the loaders' CSS travels in <style> elements, so styles may be inline
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://visitas.coleoni.com; font-src 'self'; connect-src 'self' https://visitas.coleoni.com; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  # English at the root and one page per loader (/arc/), short cache so a release shows up right away
  location / {
    try_files $uri $uri/ =404;
    expires 5m;
    error_page 404 /404.html;
  }

  # Portuguese at /pt/ (and /pt/arc/)
  location /pt/ {
    try_files $uri $uri/ =404;
    expires 5m;
    error_page 404 /404.html;
  }

  location = /pt {
    return 301 /pt/;
  }

  # the Coleoni loader is the home page, so its own address goes there
  location = /coleoni {
    return 301 /$is_args$args;
  }
  location = /coleoni/ {
    return 301 /$is_args$args;
  }
  location = /pt/coleoni {
    return 301 /pt/$is_args$args;
  }
  location = /pt/coleoni/ {
    return 301 /pt/$is_args$args;
  }

  # nginx's mime.types has no .webmanifest; a types block here only changes this file
  location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    expires 5m;
  }

  # Vite's hashed files never change
  location /assets/ {
    expires max;
  }

  location /fonts/ {
    expires 30d;
  }
}
